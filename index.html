<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red de alertas de movimiento</title><style>body{font:16px system-ui;background:#101827;color:#f4f7fb;margin:0;padding:18px}main{max-width:780px;margin:auto}section{background:#1c2a3d;border-radius:14px;padding:16px;margin:12px 0}button,input{font:inherit;padding:10px;border-radius:8px;margin:4px}button{background:#27a5ed;color:#07121d;border:0;font-weight:700}button:disabled{opacity:.4}input{max-width:95%;background:#fff}li{margin:12px 0;overflow-wrap:anywhere}.warn{color:#ffb55a}.ok{color:#6be6af}</style></head><body><main><h1>📱 Alertas de movimiento compartidas</h1><p>Los celulares conectados consultan el registro TXT del servidor cada 2 segundos.</p><section><label>Código privado del grupo: <input id="group" type="password" autocomplete="off" placeholder="Código configurado en servidor"></label><div><button id="connect">Conectar red</button><button id="start" disabled>Activar detector</button><button id="stop" disabled>Detener detector</button><button id="test" disabled>Enviar prueba</button></div><p id="status">Desconectado</p><p id="sensor">Movimiento: —</p></section><section><label>Sensibilidad (m/s² de variación): <input id="threshold" type="number" min="3" max="35" step="1" value="13"></label><p class="warn">Requiere HTTPS y permiso de movimiento y ubicación. Mantén la página abierta para recibir avisos.</p></section><section><h2>Alertas recibidas</h2><ol id="alerts"></ol></section></main><script>
const $=id=>document.getElementById(id);let connected=false,enabled=false,lastId=0,lastVector=null,lastAlert=0,poller=null,audioCtx=null,known=new Set(),firstPoll=true;
function status(s){$('status').textContent=s}function tone(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const now=audioCtx.currentTime;for(let i=0;i<3;i++){let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.001,now+i*.28);g.gain.exponentialRampToValueAtTime(.16,now+i*.28+.02);g.gain.exponentialRampToValueAtTime(.001,now+i*.28+.2);o.start(now+i*.28);o.stop(now+i*.28+.21)}}catch(e){}}
function say(s){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='es-ES';speechSynthesis.speak(u)}if(navigator.vibrate)navigator.vibrate([220,100,220])}
async function api(method,params){const res=await fetch('api.php',{method,headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:$('group').value,...params}),cache:'no-store'});let data=await res.json();if(!res.ok||!data.ok)throw Error(data.error||'Error del servidor');return data}
function show(item,notify){if(known.has(item.id))return;known.add(item.id);let li=document.createElement('li');let info=document.createElement('span');info.textContent=`${item.fecha} · ${item.origen} · ${item.tipo} · intensidad ${item.intensidad} m/s²`;li.appendChild(info);if(item.lat!==null&&item.lon!==null){let a=document.createElement('a');a.href=`https://www.google.com/maps?q=${encodeURIComponent(item.lat+','+item.lon)}`;a.target='_blank';a.rel='noopener noreferrer';a.textContent=' · Ver ubicación';li.appendChild(a)}$('alerts').prepend(li);if($('alerts').children.length>50)$('alerts').lastChild.remove();if(notify){tone();say('Alerta: movimiento brusco detectado en un celular del grupo')}}
async function poll(){if(!connected)return;try{let data=await api('POST',{accion:'leer',desde:lastId});for(const item of data.alertas){show(item,!firstPoll);lastId=Math.max(lastId,item.id)}firstPoll=false;status('Conectado: alertas sincronizadas')}catch(e){status('Error de conexión: '+e.message)}}
$('connect').onclick=async()=>{if(!$('group').value){status('Introduce el código del grupo');return}try{await api('POST',{accion:'verificar'});connected=true;firstPoll=true;lastId=0;known.clear();$('alerts').replaceChildren();$('start').disabled=false;$('test').disabled=false;$('group').disabled=true;$('connect').disabled=true;await poll();poller=setInterval(poll,2000)}catch(e){status('No se pudo conectar: '+e.message)}};
async function gps(){return new Promise(resolve=>{if(!navigator.geolocation)return resolve({lat:null,lon:null});navigator.geolocation.getCurrentPosition(p=>resolve({lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6)}),()=>resolve({lat:null,lon:null}),{enableHighAccuracy:true,timeout:4500,maximumAge:10000})})}
async function send(tipo,intensidad){let coords=await gps();try{let data=await api('POST',{accion:'registrar',tipo,intensidad:+intensidad.toFixed(2),...coords});show(data.alerta,true);lastId=Math.max(lastId,data.alerta.id);status('Alerta registrada y compartida')}catch(e){status('No se pudo enviar la alerta: '+e.message)}}
function movement(e){if(!enabled)return;const a=e.acceleration||e.accelerationIncludingGravity;if(a==null||[a.x,a.y,a.z].some(v=>v==null))return;let v=[a.x,a.y,a.z];if(lastVector){let delta=Math.hypot(...v.map((x,i)=>x-lastVector[i]));$('sensor').textContent='Variación: '+delta.toFixed(1)+' m/s²';if(delta>=Number($('threshold').value)&&Date.now()-lastAlert>7000){lastAlert=Date.now();send('movimiento brusco',delta)}}lastVector=v}
$('start').onclick=async()=>{try{tone();if(typeof DeviceMotionEvent==='undefined')throw Error('Este navegador no admite DeviceMotion');if(typeof DeviceMotionEvent.requestPermission==='function'){let p=await DeviceMotionEvent.requestPermission();if(p!=='granted')throw Error('Permiso de movimiento denegado')}enabled=true;window.addEventListener('devicemotion',movement);$('start').disabled=true;$('stop').disabled=false;status('Detector activado')}catch(e){status(e.message)}};
$('stop').onclick=()=>{enabled=false;window.removeEventListener('devicemotion',movement);lastVector=null;$('start').disabled=false;$('stop').disabled=true;status('Detección detenida; sigue conectado para recibir alertas')};
$('test').onclick=()=>{tone();send('prueba',0)};
</script></body></html>
